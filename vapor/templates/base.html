<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vapor{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1b2838; color: #c7d5e0; line-height: 1.6; }
    a { color: #66c0f4; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 1rem; }

    nav { background: #171a21; padding: 0.75rem 0; border-bottom: 1px solid #2a475e; }
    nav .container { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    nav .brand { font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 0.05em; }
    nav .links { display: flex; gap: 1rem; flex-wrap: wrap; }
    nav .links a { color: #b8b6b4; font-size: 0.9rem; }
    nav .links a:hover { color: #fff; }
    nav .spacer { flex: 1; }

    main { padding: 2rem 0; }
    h1, h2, h3 { color: #fff; margin-bottom: 1rem; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.3rem; }

    .card { background: #16202d; border: 1px solid #2a475e; border-radius: 4px; padding: 1rem; margin-bottom: 1rem; }
    .card h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.75rem; font-weight: 600; }
    .badge-pending { background: #e5a100; color: #000; }
    .badge-approved { background: #4caf50; color: #fff; }
    .badge-rejected { background: #f44336; color: #fff; }
    .badge-paid { background: #4caf50; color: #fff; }
    .badge-genre { background: #2a475e; color: #c7d5e0; }

    .price { color: #acdbf5; font-weight: 700; font-size: 1.1rem; }

    form.inline { display: inline; }

    input, select, textarea {
      background: #2a475e; border: 1px solid #3d6b8e; border-radius: 3px;
      color: #c7d5e0; padding: 0.5rem 0.75rem; font-size: 0.9rem; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #66c0f4; }
    textarea { min-height: 80px; resize: vertical; }

    label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: #8f98a0; }
    .field { margin-bottom: 1rem; }

    .btn {
      display: inline-block; padding: 0.5rem 1.25rem; border: none; border-radius: 3px;
      font-size: 0.9rem; cursor: pointer; text-align: center;
    }
    .btn-primary { background: #1a9fff; color: #fff; }
    .btn-primary:hover { background: #66c0f4; text-decoration: none; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-success:hover { background: #66bb6a; }
    .btn-danger { background: #f44336; color: #fff; }
    .btn-danger:hover { background: #e57373; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; }

    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .search-bar input, .search-bar select { width: auto; flex: 1; min-width: 150px; }

    .flash { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; background: #f44336; color: #fff; }

    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid #2a475e; }
    .table th { color: #8f98a0; font-size: 0.8rem; text-transform: uppercase; }

    .text-right { text-align: right; }
    .mt-1 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="brand">VAPOR</a>
      <div class="links">
        <a href="/catalog">Catalog</a>
        {% if user %}
          <a href="/library">Library</a>
          <a href="/orders">Orders</a>
          <a href="/cart">Cart</a>
          <a href="/creator/games">My Games</a>
          {% if user.role.value == 'administrator' %}
            <a href="/admin/moderation">Moderation</a>
          {% endif %}
        {% endif %}
      </div>
      <div class="spacer"></div>
      <div class="links">
        {% if user %}
          <span style="color:#8f98a0">{{ user.name }}</span>
          <a href="/logout">Logout</a>
        {% else %}
          <a href="/login">Login</a>
          <a href="/register">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
